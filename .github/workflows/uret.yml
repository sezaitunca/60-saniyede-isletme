name: Günlük video üret
on:
  schedule:
    - cron: "0 4 * * *"   # her gün 07:00 (Türkiye, UTC+3)
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
jobs:
  uret:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: pip install -r requirements.txt
      - uses: actions/cache@v4
        with:
          path: sesler
          key: piper-sesler-v1
      - run: python -m piper.download_voices --download-dir sesler tr_TR-dfki-medium en_US-lessac-medium de_DE-thorsten-medium ru_RU-irina-medium
      - run: python uret.py
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      - run: touch cikti/.nojekyll
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: cikti
      - uses: actions/deploy-pages@v4
